<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Cloudflare Index Explorer</title>
    <script>
      // SPA redirect for GitHub Pages
      // When a user refreshes or navigates directly to a route that doesn't exist,
      // GitHub Pages serves this 404.html. We redirect back to index.html with the
      // original path preserved as a query parameter.
      var pathSegmentsToKeep = 1; // /Cloudflare_Index/ base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting&hellip;</p>
  </body>
</html>
